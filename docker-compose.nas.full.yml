name: forge
services:
  forge:
    cpu_shares: 90
    command: []
    # Image publiée : https://hub.docker.com/r/bobdivx/forge/tags
    # Surcharge : FORGE_IMAGE=docker.io/bobdivx/forge:dev (ou :sha-…)
    image: "${FORGE_IMAGE:-docker.io/bobdivx/forge:latest}"
    pull_policy: always
    container_name: forge
    labels:
      org.opencontainers.image.url: "https://hub.docker.com/r/bobdivx/forge"
      org.opencontainers.image.source: "https://github.com/bobdivx/Forge"
    deploy:
      resources:
        reservations:
          memory: "134217728"
    restart: unless-stopped
    ports:
      - "${FORGE_PORT:-4321}:4321"
    # CasaOS/ZimaOS : le compose est exécuté sous /tmp sans copie de .env — variables dans l’UI de l’app ou ci-dessous.
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      NODE_ENV: production
      ASTRO_DATABASE_FILE: "file:/app/.astro/content.db"
      OLLAMA_HOST: "${OLLAMA_HOST:-http://host.docker.internal:11434}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4321/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    volumes:
      - type: bind
        source: /DATA/AppData/forge/astro
        target: /app/.astro
      - type: bind
        source: /DATA/AppData/forge/data
        target: /app/.data
    networks:
      - forge-net

  postgres:
    cpu_shares: 90
    command: []
    image: postgres:16-alpine
    container_name: forge-postgres
    deploy:
      resources:
        reservations:
          memory: "134217728"
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-forge}"
      POSTGRES_USER: "${POSTGRES_USER:-forge}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-forge_change_me}"
    volumes:
      - type: bind
        source: /DATA/AppData/forge/postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forge} -d ${POSTGRES_DB:-forge}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - forge-net

  redis:
    cpu_shares: 90
    image: redis:7-alpine
    container_name: forge-redis
    deploy:
      resources:
        reservations:
          memory: "134217728"
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - type: bind
        source: /DATA/AppData/forge/redis
        target: /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - forge-net

  # Reverse proxy optionnel (si tu veux exposer Forge derrière un domaine/HTTPS).
  # À activer: décommente ce service + ajoute une conf nginx (non fournie ici).
  #
  # nginx:
  #   image: nginx:1.27-alpine
  #   container_name: forge-nginx
  #   restart: unless-stopped
  #   depends_on:
  #     - forge
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - ./deploy/certs:/etc/nginx/certs:ro
  #   networks:
  #     - forge-net

networks:
  forge-net:
    name: forge-net

x-casaos:
  architectures:
    - amd64
    - arm64
  author: Forge
  category: Development
  hostname: zimaos.local
  icon: https://raw.githubusercontent.com/withastro/astro/main/assets/astro-icon-light-gradient.svg
  index: /
  is_uncontrolled: false
  port_map: "${FORGE_PORT:-4321}"
  scheme: http
  store_app_id: forge-full
  title:
    custom: Forge (NAS Full)
    en_us: Forge (NAS Full)
