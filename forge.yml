name: forge
services:
  forge:
    cpu_shares: 90
    command: []
    container_name: forge
    deploy:
      resources:
        limits:
          memory: 33487568896
        reservations:
          memory: "134217728"
          devices: []
    environment:
      - ASTRO_DATABASE_FILE=file:/app/.astro/content.db
      - HOST=0.0.0.0
      - NODE_ENV=production
      # Origine API Ollama (GET /api/tags) depuis le conteneur → hôte NAS. Surchargeable en UI Paramètres.
      - OLLAMA_HOST=http://host.docker.internal:11434
      # Runtime ZimaOS public (port typique 24190) si la base est vide ; UI / DB priment souvent.
      - FORGE_ZIMAOS_RUNTIME_URL=http://host.docker.internal:24190
      - PORT=4321
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:4321/login >/dev/null || exit 1
      timeout: 10s
      interval: 30s
      retries: 5
      start_period: 40s
    image: bobdivx/forge:dev
    labels:
      icon: https://icon.casaos.io/main/all/forge.png
      org.opencontainers.image.source: https://github.com/bobdivx/Forge
      org.opencontainers.image.url: https://hub.docker.com/r/bobdivx/forge
    ports:
      - target: 4321
        published: "4331"
        protocol: tcp
    privileged: true
    pull_policy: always
    restart: unless-stopped
    volumes:
      # Accès au démon Docker de l’hôte (sondes docker inspect / exec pour ZimaOS). Le mode privileged seul ne suffit pas.
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: /media/Docker/AppData/forge/astro
        target: /app/.astro
      - type: bind
        source: /media/Docker/AppData/forge/data
        target: /app/.data
      - type: bind
        source: /media/Docker/AppData
        target: /mnt/AppData
      - type: bind
        source: /media/Docker/yaml
        target: /mnt/yaml
      - type: bind
        source: /media/GitHub
        target: /mnt/GitHub
    devices: []
    cap_add: []
    networks:
      - forge-net
networks:
  forge-net:
    name: forge-net
x-casaos:
  architectures:
    - amd64
    - arm64
  author: Forge
  category: Development
  main: forge
  hostname: ""
  icon: https://icon.casaos.io/main/all/forge.png
  index: /
  is_uncontrolled: false
  port_map: "4331"
  scheme: http
  store_app_id: forge
  tagline:
    en_us: Forge dashboard on NAS
    fr_fr: Tableau de bord Forge sur NAS
  title:
    custom: Forge (NAS)
    en_us: Forge (NAS)
    fr_fr: Forge (NAS)
