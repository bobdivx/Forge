name: forge
services:
  forge:
    cpu_shares: 90
    command: []
    container_name: forge
    deploy:
      resources:
        limits:
          memory: 33487568896
        reservations:
          memory: "134217728"
          devices: []
    environment:
      - HOST=0.0.0.0
      - NODE_ENV=production
      - PORT=4321
      # Même cible au build Docker et au run (évite db.sqlite vs content.db).
      - ASTRO_DATABASE_FILE=file:/app/.astro/content.db
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:4321/login >/dev/null || exit 1
      timeout: 10s
      interval: 30s
      retries: 5
      start_period: 40s
    image: bobdivx/forge:dev
    labels:
      icon: https://icon.casaos.io/main/all/forge.png
      org.opencontainers.image.source: https://github.com/bobdivx/Forge
      org.opencontainers.image.url: https://hub.docker.com/r/bobdivx/forge
    ports:
      - target: 4321
        published: "4331"
        protocol: tcp
    privileged: true
    pull_policy: always
    restart: unless-stopped
    volumes:
      - type: bind
        source: /media/DATA/AppData/forge/astro
        target: /app/.astro
      - type: bind
        source: /media/DATA/AppData/forge/data
        target: /app/.data
    devices: []
    cap_add: []
    networks:
      - forge-net
networks:
  forge-net:
    name: forge-net
x-casaos:
  architectures:
    - amd64
    - arm64
  author: Forge
  category: Development
  hostname: ""
  icon: https://icon.casaos.io/main/all/forge.png
  index: /
  is_uncontrolled: false
  port_map: "4331"
  scheme: http
  store_app_id: forge
  title:
    custom: Forge (NAS)
    en_us: Forge (NAS)
