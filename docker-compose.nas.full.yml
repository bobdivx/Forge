services:
  forge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forge
    restart: unless-stopped
    ports:
      - "${FORGE_PORT:-4321}:4321"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      NODE_ENV: production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4321/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    volumes:
      # Astro DB (SQLite) vit ici par défaut — on le rend persistant sur NAS.
      - forge-astro:/app/.astro
      # Espace “données” générique si tu en as besoin côté serveur.
      - forge-data:/app/.data
    networks:
      - forge-net

  postgres:
    image: postgres:16-alpine
    container_name: forge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-forge}"
      POSTGRES_USER: "${POSTGRES_USER:-forge}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-forge_change_me}"
    volumes:
      - forge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forge} -d ${POSTGRES_DB:-forge}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - forge-net

  redis:
    image: redis:7-alpine
    container_name: forge-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - forge-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - forge-net

  # Reverse proxy optionnel (si tu veux exposer Forge derrière un domaine/HTTPS).
  # À activer: décommente ce service + ajoute une conf nginx (non fournie ici).
  #
  # nginx:
  #   image: nginx:1.27-alpine
  #   container_name: forge-nginx
  #   restart: unless-stopped
  #   depends_on:
  #     - forge
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - ./deploy/certs:/etc/nginx/certs:ro
  #   networks:
  #     - forge-net

volumes:
  forge-astro:
  forge-data:
  forge-postgres:
  forge-redis:

networks:
  forge-net:
